[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oulad-dbmf"
version = "0.1.0"
description = "Demographic-aware course recommendation and auditable OULAD experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["recommendation", "matrix-factorization", "cold-start", "oulad", "education"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "torch>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
dbmf = "dbmf.cli:main"

[tool.setuptools.packages.find]
include = ["dbmf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
